[package]
name = "tmux-autocomplete"
version = "1.0.0"
edition = "2024"
description = "Autocomplete identifiers from the contents of the current tmux window"
readme = "README.md"
license = "MIT"
repository = "https://github.com/XobSod/tmux-autocomplete-rs"

[[bin]]
name = "tmux-autocomplete"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
crossterm = "0.29.0"
log = { version = "0.4.34", features = ["std"] }
nix = { version = "0.31.3", features = ["fs"] }
nucleo-matcher = "0.3.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
unicode-width = "0.2.2"

[profile.release]
lto = true
strip = true
